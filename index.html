<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec, #ffb3c6);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(225, 50, 100, 0.2);
            backdrop-filter: blur(10px);
            max-width: 450px;
            width: 90%;
            transition: all 0.5s ease;
            position: relative;
        }

        h1 {
            color: #d90429;
            font-size: 2.2rem;
            margin-bottom: 20px;
        }

        .gif-container {
            width: 100%;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .gif-container img {
            max-height: 100%;
            border-radius: 10px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
            position: relative;
            min-height: 60px; /* Gives the No button space to move */
        }

        .btn {
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
            z-index: 1;
        }

        #yesBtn:hover {
            background-color: #43a047;
            transform: scale(1.1);
        }

        #noBtn {
            background-color: #e63946;
            color: white;
            white-space: nowrap;
            z-index: 2;
            /* Changed to relative so it starts side-by-side with Yes */
            position: relative; 
            transition: left 0.1s ease, top 0.1s ease;
        }

        .hidden {
            display: none !important;
        }

        /* Floating hearts animation */
        .heart {
            position: fixed;
            font-size: 1.5rem;
            color: #ff4d6d;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            z-index: 10;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.3);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <!-- Question Page -->
        <div id="questionSection">
            <h1 id="questionText">Will you be my Valentine? 🌹</h1>
            <div class="gif-container">
                <!-- Swapped to a highly reliable, persistent cute cat GIF link -->
                <img id="statusGif" src="https://tenor.com" alt="Cute Requesting Bear">
            </div>
            <div class="buttons">
                <button class="btn" id="yesBtn">Yes!</button>
                <button class="btn" id="noBtn">No</button>
            </div>
        </div>

        <!-- Success Page -->
        <div id="successSection" class="hidden">
            <h1>Yay! I knew you'd say yes! 🥰❤️</h1>
            <div class="gif-container">
                <img src="https://tenor.com" alt="Happy Dancing Bears">
            </div>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionSection = document.getElementById('questionSection');
        const successSection = document.getElementById('successSection');
        const questionText = document.getElementById('questionText');

        let noClickCount = 0;
        const fallbackPhrases = [
            "Are you sure? 🥺",
            "Think again! 💔",
            "Please? 🎀",
            "Don't do this to me... 😭",
            "Surely you misclicked! 👀"
        ];

        // Make the "No" button move away on hover or click
        function moveNoButton() {
            // Switch layout to absolute style ONLY after the user interacts with it
            if (noBtn.style.position !== 'absolute') {
                noBtn.style.position = 'absolute';
            }

            const container = document.getElementById('mainContainer');
            const containerRect = container.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();

            // Calculate safe boundaries inside the card container
            const maxX = containerRect.width - btnRect.width - 40;
            const maxY = containerRect.height - btnRect.height - 40;

            // Generate random positions centered dynamically
            const randomX = Math.floor(Math.random() * maxX) - (containerRect.width / 2 - btnRect.width);
            const randomY = Math.floor(Math.random() * maxY) - (containerRect.height / 2 - btnRect.height);

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;

            // Change text dynamically
            if (noClickCount < fallbackPhrases.length) {
                questionText.innerText = fallbackPhrases[noClickCount];
                noClickCount++;
            }
        }

        // Handles both desktop mouse hovers and mobile screen touches flawlessly
        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevents accidental double click triggers on mobile devices
            moveNoButton();
        });
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // Trigger the celebration on clicking "Yes"
        yesBtn.addEventListener('click', () => {
            questionSection.classList.add('hidden');
            successSection.classList.remove('hidden');
            startHeartRain();
        });

        // Decorative falling heart effect on success
        function startHeartRain() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerText = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = Math.random() * 2 + 3 + 's';
                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }, 300);
        }
    </script>
</body>
</html>
