<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be My Valentine? ❤️</title>
  <style>
    :root {
      --bg-color: #fff0f3;
      --card-bg: #ffffff;
      --text-color: #4a1525;
      --primary-color: #ff4d6d;
      --secondary-color: #c9184a;
      --accent-color: #ffccd5;
      --radius: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow: hidden;
    }

    .container {
      max-width: 450px;
      width: 100%;
      background: var(--card-bg);
      padding: 3rem 2rem;
      border-radius: var(--radius);
      box-shadow: 0 15px 35px rgba(201, 24, 74, 0.1);
      text-align: center;
      border: 2px solid var(--accent-color);
      position: relative;
    }

    .heart-icon {
      font-size: 4.5rem;
      margin-bottom: 1rem;
      display: inline-block;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    h1 {
      font-size: 2.2rem;
      color: var(--secondary-color);
      margin-bottom: 1.5rem;
      line-height: 1.3;
    }

    .button-group {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      align-items: center;
      margin-top: 2rem;
      min-height: 120px;
    }

    .btn {
      padding: 0.85rem 2rem;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-yes {
      background-color: var(--primary-color);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
      z-index: 10;
    }

    .btn-no {
      background-color: #f8f9fa;
      color: #6c757d;
      border: 1px solid #dee2e6;
      position: absolute;
      z-index: 999;
      white-space: nowrap;
      transition: top 0.2s ease, left 0.2s ease;
    }

    .success-view {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="quiz-view">
      <div class="heart-icon" id="emoji-state">🥺</div>
      <h1 id="question-text">Will you be my Valentine?</h1>
      
      <div class="button-group">
        <button class="btn btn-yes" id="yes-btn" onclick="celebrate()">Yes</button>
        <button class="btn btn-no" id="no-btn">No</button>
      </div>
    </div>

    <div id="success-view" class="success-view">
      <div class="heart-icon">🥰🎉💖</div>
      <h1 style="color: var(--secondary-color);">Yay! Best Decision Ever!</h1>
      <p style="font-size: 1.2rem; font-weight: 500; margin-top: 1rem;">I knew you couldn't escape my love! 😉</p>
    </div>
  </div>

  <script>
    let clickCount = 0;
    let yesScale = 1;
    let isMoving = false; // Prevents the code from firing double triggers on touchscreens

    const beggingPhrases = [
      "No",
      "Wait, don't! 😭",
      "Are you sure? 😢",
      "Please think about it... 🙏",
      "Pretty please?? ✨",
      "I'll buy you snacks! 🥺",
      "You're breaking my heart 💔",
      "Don't click me! 😂",
      "Pleaseeeee? 💕",
      "Click the YES button! 👇"
    ];

    const noBtn = document.getElementById('no-btn');
    const yesBtn = document.getElementById('yes-btn');
    const emojiState = document.getElementById('emoji-state');
    const questionText = document.getElementById('question-text');

    // Set stable initial relative positions
    window.onload = function() {
      noBtn.style.left = "calc(50% + 30px)";
      noBtn.style.top = "calc(100% - 130px)";
    }

    function fleeAndBeg(e) {
      // Stop double events from mobile taps dead in their tracks
      if (isMoving) return;
      isMoving = true;
      setTimeout(() => { isMoving = false; }, 200);

      clickCount++;

      // 1. Instantly swap the phrase on the button text array
      const phraseIndex = clickCount % beggingPhrases.length;
      noBtn.innerText = beggingPhrases[phraseIndex];

      // 2. Modify heading text based on how persistent they are
      if (clickCount >= 2 && clickCount < 5) {
        emojiState.innerText = "😭";
        questionText.innerText = "Wait, look what you're doing!";
      } else if (clickCount >= 5) {
        emojiState.innerText = "🧎‍♂️💥";
        questionText.innerText = "Please stop avoiding me!";
      }

      // 3. Teleport the button safely to absolute window layout bounds
      const padding = 70;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;
      
      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
      
      noBtn.style.position = 'fixed';
      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';

      // 4. Boost the size of the "Yes" button
      yesScale += 0.35;
      yesBtn.style.transform = `scale(${yesScale})`;
    }

    // Attach listeners separately so they never double-fire
    noBtn.addEventListener('mouseover', fleeAndBeg);
    noBtn.addEventListener('click', function(e) {
      e.preventDefault();
      fleeAndBeg(e);
    });

    function celebrate() {
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('success-view').style.display = 'block';
      document.body.style.backgroundColor = '#ffdde2';
      noBtn.style.display = 'none';
    }
  </script>

</body>
</html>
