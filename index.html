<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Valentine's Day! ❤️</title>
  <style>
    /* Valentine Palette & Variables */
    :root {
      --bg-color: #fff0f3;
      --card-bg: #ffffff;
      --text-color: #4a1525;
      --primary-color: #ff4d6d;
      --secondary-color: #c9184a;
      --accent-color: #ffb3c1;
      --border-color: #ffccd5;
      --radius: 20px;
      --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Reset & Base Styles */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Main Container */
    .container {
      max-width: 500px;
      width: 100%;
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(201, 24, 74, 0.1);
      text-align: center;
      border: 2px solid var(--border-color);
    }

    /* Floating Heart Animation */
    .heart-icon {
      font-size: 4rem;
      display: inline-block;
      animation: float 2.5s ease-in-out infinite;
      margin-bottom: 1rem;
    }

    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-10px) scale(1.05); }
      100% { transform: translateY(0px) scale(1); }
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--secondary-color);
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }

    p.message {
      font-size: 1.1rem;
      color: var(--text-color);
      opacity: 0.9;
      margin-bottom: 2rem;
    }

    /* Interactive Buttons Layout */
    .button-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 60px;
    }

    .btn {
      padding: 0.85rem 2rem;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      outline: none;
    }

    .btn-yes {
      background-color: var(--primary-color);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
    }

    .btn-yes:hover {
      background-color: var(--secondary-color);
      transform: scale(1.05);
    }

    /* Runaway "No" button style */
    .btn-no {
      background-color: var(--accent-color);
      color: var(--secondary-color);
      position: relative;
    }

    /* Success State View (Hidden initially) */
    .success-view {
      display: none;
    }

    .success-view h2 {
      color: var(--secondary-color);
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Interactive Questionnaire Container -->
    <div id="quiz-view">
      <div class="heart-icon">❤️</div>
      <h1>Will you be my Valentine?</h1>
      <p class="message">Every moment with you is my absolute favourite.</p>
      
      <div class="button-group">
        <button class="btn btn-yes" onclick="celebrate()">Yes!</button>
        <!-- The elusive "No" button -->
        <button class="btn btn-no" id="no-btn" onmouseover="runAway()" onclick="runAway()">No</button>
      </div>
    </div>

    <!-- Celebration Screen -->
    <div id="success-view" class="success-view">
      <div class="heart-icon">🎉💝✨</div>
      <h1>Yay! Best Decision Ever!</h1>
      <h2>I knew you'd say yes! 🥰</h2>
      <p style="margin-top: 1rem;">Prepare yourself for the best Valentine's Day ever.</p>
    </div>
  </div>

  <script>
    // Makes the "No" button jump away whenever they try to hover over or click it
    function runAway() {
      const btn = document.getElementById('no-btn');
      
      // Calculate random, clean coordinates within a safe screen range
      const randomX = Math.floor(Math.random() * 160) - 80; 
      const randomY = Math.floor(Math.random() * 120) - 60;
      
      btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

    // Handles transitioning to the success state
    function celebrate() {
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('success-view').style.display = 'block';
      
      // Add a simple burst background color flash for visual reward
      document.body.style.backgroundColor = '#ffdde2';
    }
  </script>

</body>
</html>
