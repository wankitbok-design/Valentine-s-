<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="mainContainer">
        <!-- Question Page -->
        <div id="questionSection">
            <h1 id="questionText">Will you be my Valentine? 🌹</h1>
            <div class="gif-container">
                <!-- Points directly to the file you uploaded to GitHub -->
                <img id="statusGif" src="cat-ask.gif" alt="Cute Requesting Cat">
            </div>
            <div class="buttons">
                <button class="btn" id="yesBtn">Yes!</button>
                <button class="btn" id="noBtn">No</button>
            </div>
        </div>

        <!-- Success Page -->
        <div id="successSection" class="hidden">
            <h1>Yay! I knew you'd say yes! 🥰❤️</h1>
            <div class="gif-container">
                <!-- Points directly to the file you uploaded to GitHub -->
                <img src="cat-happy.gif" alt="Happy Dancing Cats">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
