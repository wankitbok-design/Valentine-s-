<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be My Valentine? ❤️</title>
  <style>
    :root {
      --bg-color: #fff0f3;
      --card-bg: #ffffff;
      --text-color: #4a1525;
      --primary-color: #ff4d6d;
      --secondary-color: #c9184a;
      --accent-color: #ffccd5;
      --radius: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
      position: relative;
    }

    .container {
      max-width: 400px;
      width: 100%;
      background: var(--card-bg);
      padding: 3.5rem 2rem;
      border-radius: var(--radius);
      box-shadow: 0 15px 35px rgba(201, 24, 74, 0.1);
      text-align: center;
      border: 2px solid var(--accent-color);
      z-index: 2;
    }

    .heart-icon {
      font-size: 4.5rem;
      margin-bottom: 1.5rem;
      display: inline-block;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    h1 {
      font-size: 2.2rem;
      color: var(--secondary-color);
      margin-bottom: 1rem;
      line-height: 1.3;
    }

    p.sub-text {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      opacity: 0.9;
    }

    .button-group {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      align-items: center;
      min-height: 80px;
      position: relative;
    }

    .btn {
      padding: 0.85rem 2.2rem;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .btn-yes {
      background-color: var(--primary-color);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
      z-index: 10;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-no {
      background-color: #f8f9fa;
      color: #6c757d;
      border: 1px solid #dee2e6;
      position: fixed; 
      z-index: 9999;
      white-space: nowrap;
      transition: top 0.15s ease-out, left 0.15s ease-out;
    }

    .success-view {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="quiz-view">
      <div class="heart-icon" id="emoji-state">❤️</div>
      <h1 id="question-text">Will you be my Valentine?</h1>
      <p class="sub-text" id="sub-message">Every moment with you is my absolute favourite.</p>
      
      <div class="button-group">
        <button class="btn btn-yes" id="yes-btn" onclick="celebrate()">Yes</button>
        <button class="btn btn-no" id="no-btn">No</button>
      </div>
    </div>

    <div id="success-view" class="success-view">
      <div class="heart-icon">🥰🎉💖</div>
      <h1 style="color: var(--secondary-color);">Yay! Best Decision Ever!</h1>
      <p style="font-size: 1.2rem; font-weight: 500; margin-top: 1rem;">I knew you couldn't escape my love! 😉</p>
    </div>
  </div>

  <script>
    let clickCount = 0;
    let yesScale = 1;
    let locationDebounce = false;

    const beggingPhrases = [
      "No",
      "Wait, don't! 😭",
      "Are you sure? 😢",
      "Please think about it... 🙏",
      "Pretty please?? ✨",
      "I'll buy you snacks! 🥺",
      "You're breaking my heart 💔",
      "Don't click me! 😂",
      "Pleaseeeee? 💕",
      "Click the YES button! 👇"
    ];

    const noBtn = document.getElementById('no-btn');
    const yesBtn = document.getElementById('yes-btn');
    const emojiState = document.getElementById('emoji-state');
    const questionText = document.getElementById('question-text');
    const subMessage = document.getElementById('sub-message');

    function positionNoButtonInitially() {
      const yesRect = yesBtn.getBoundingClientRect();
      noBtn.style.left = (yesRect.right + 20) + 'px';
      noBtn.style.top = yesRect.top + 'px';
    }

    window.onload = positionNoButtonInitially;
    window.onresize = positionNoButtonInitially;

    function fleeAndBeg(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      
      clickCount++;

      // 1. Force the innerText update down to the DOM layer explicitly before repositioning
      const phraseIndex = clickCount % beggingPhrases.length;
      noBtn.innerText = beggingPhrases[phraseIndex];

      // 2. Adjust core heading prompts to make the card plea dynamic
      if (clickCount === 2) {
        emojiState.innerText = "😭";
        questionText.innerText = "Wait, look what you're doing!";
        subMessage.innerText = "Don't run away from me!";
      } else if (clickCount === 5) {
        emojiState.innerText = "🧎‍♂️💥";
        questionText.innerText = "Please stop avoiding me!";
        subMessage.innerText = "I'm literally on my knees here.";
      }

      // 3. Teleport layout handler with touch safety thresholds built-in
      if (locationDebounce) return;
      locationDebounce = true;
      setTimeout(() => { locationDebounce = false; }, 80);

      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      
      const padding = 50;
      const maxRandomX = screenWidth - noBtn.offsetWidth - (padding * 2);
      const maxRandomY = screenHeight - noBtn.offsetHeight - (padding * 2);

      const randomX = Math.max(padding, Math.floor(Math.random() * maxRandomX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxRandomY));

      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';

      // 4. Update relative scaling values on target confirmation button
      yesScale += 0.35;
      yesBtn.style.transform = `scale(${yesScale})`;
    }

    // Explicit cross-platform system execution attachment layers
    noBtn.addEventListener('touchstart', fleeAndBeg, { passive: false });
    noBtn.addEventListener('mouseover', fleeAndBeg);
    noBtn.addEventListener('click', fleeAndBeg);

    function celebrate() {
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('success-view').style.display = 'block';
      document.body.style.backgroundColor = '#ffdde2';
      noBtn.style.display = 'none';
    }
  </script>

</body>
</html>
