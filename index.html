<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message For You ❤️</title>
    <style>
        :root {
            --primary: #ff4d6d;
            --primary-hover: #ff758f;
            --bg-gradient: linear-gradient(135deg, #ffe5ec, #ffb3c6);
            --envelope-bg: #ff758f;
            --envelope-inside: #ff85a1;
            --envelope-flap: #ff4d6d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Georgia', serif;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Envelope Wrapper */
        .valentines-wrapper {
            position: relative;
            width: 380px;
            height: 280px;
            cursor: pointer;
            transition: transform 0.5s ease;
        }

        .valentines-wrapper.open {
            cursor: default;
        }

        /* The Envelope Base Container */
        .envelope {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: var(--envelope-bg);
            border-radius: 0 0 10px 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        /* The Flap that folds down */
        .envelope::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 190px solid transparent;
            border-right: 190px solid transparent;
            border-top: 150px solid var(--envelope-flap);
            transform-origin: top;
            transition: transform 0.4s ease 0.2s;
            z-index: 4;
        }

        /* When opened, flap flips upwards */
        .valentines-wrapper.open .envelope::before {
            transform: rotateX(180deg);
            z-index: 1;
            transition: transform 0.4s ease, z-index 0.1s ease 0.2s;
        }

        /* The inside side-pockets of envelope */
        .envelope::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 190px solid var(--envelope-inside);
            border-right: 190px solid var(--envelope-inside);
            border-top: 140px solid transparent;
            border-radius: 0 0 10px 10px;
            z-index: 3;
            pointer-events: none;
        }

        /* The Letter Card inside */
        .letter {
            position: absolute;
            bottom: 10px;
            left: 20px;
            width: 340px;
            height: 240px;
            background: #fffdf9;
            border-radius: 8px;
            padding: 25px 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.4s;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        /* Pull the letter out when open class is applied */
        .valentines-wrapper.open .letter {
            transform: translateY(-160px);
            height: 300px;
            z-index: 5;
        }

        .letter h1 {
            color: #d90429;
            font-size: 1.6rem;
            line-height: 1.3;
        }

        .letter p {
            color: #4a4a4a;
            font-size: 1.05rem;
            line-height: 1.5;
            margin: 10px 0;
        }

        /* Action Buttons */
        .button-group {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            position: relative;
            margin-top: 10px;
            height: 45px;
        }

        .btn {
            padding: 10px 28px;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Segoe UI', sans-serif;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: background 0.2s, transform 0.1s;
        }

        .btn-yes {
            background-color: #2a9d8f;
            color: white;
        }

        .btn-yes:hover {
            background-color: #21867a;
            transform: scale(1.05);
        }

        .btn-no {
            background-color: #e63946;
            color: white;
            position: absolute;
            transition: left 0.2s ease, top 0.2s ease;
        }

        /* Heart Icon on Front of Envelope */
        .envelope-heart {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: #d90429;
            z-index: 5;
            transition: opacity 0.3s ease 0.2s, transform 0.3s ease;
            animation: pulse 1.5s infinite;
        }

        .valentines-wrapper.open .envelope-heart {
            opacity: 0;
            transform: translate(-50%, -100%) scale(0);
            pointer-events: none;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.15); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* Floating particles setup */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            animation: floatAway 3s linear forwards;
        }

        @keyframes floatAway {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(0.5) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

        <div class="envelope-heart">❤️</div>
        <div class="envelope">
            <div class="letter" id="letterCard">
                <div id="interactiveContent">
                    <h1 id="headline">My heart beats faster when you are around... 🥰</h1>
                    <p id="subtext">Will you do me the absolute honor of being my Valentine?</p>
                    <div class="button-group" id="btnGroup">
                        <button class="btn btn-yes" id="yesBtn">Yes!</button>
                        <button class="btn btn-no" id="noBtn">No</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
